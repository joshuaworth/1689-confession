<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 52.5vw; overflow: hidden; }
  body { background: #faf9f7; color: #1c1b1a; position: relative;
         display: flex; flex-direction: column; justify-content: center; padding: 0 7vw; }
  .kicker { font: 600 1.55vw "Instrument Sans", sans-serif; text-transform: uppercase;
            letter-spacing: .14em; color: #8a1016; margin-bottom: 2.2vw; }
  h1 { font-family: "EB Garamond", serif; font-weight: 500; font-size: 8.6vw;
       line-height: .95; letter-spacing: -0.015em; }
  .meta { display: flex; gap: 0; font: 500 1.5vw "Instrument Sans", sans-serif;
          color: #5c5955; margin-top: 3vw; align-items: center; }
  .meta span { display: flex; align-items: center; }
  .meta span + span::before { content: ""; width: .45vw; height: .45vw; border-radius: 50%;
    background: #8a1016; margin: 0 1.4vw; }
  .mark { position: absolute; top: 4.5vw; right: 7vw; font: 600 2vw "Instrument Sans", sans-serif;
          letter-spacing: -0.03em; }
  .mark b { color: #8a1016; }
</style>
</head>
<body>
  <div class="mark">1689<b>.</b></div>
  <div class="kicker">The Second London Baptist Confession</div>
  <h1>The Baptist<br>Confession of&nbsp;Faith</h1>
  <div class="meta"><span>32 chapters</span><span>770 proofs</span><span>BSB · KJV · WEB</span><span>Public domain</span></div>
</body>
</html>
