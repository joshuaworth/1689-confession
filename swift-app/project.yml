name: Confession1689
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 14
    DEVELOPMENT_TEAM: NPVX6Z996W
    SWIFT_VERSION: "5.9"
targets:
  Confession1689:
    type: application
    platform: iOS
    sources:
      - path: Confession1689/Sources
      - path: Confession1689/Resources
        buildPhase: resources
      - path: Confession1689/Assets.xcassets
    dependencies:
      - target: Confession1689Widgets
        embed: true
      - target: Confession1689Watch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intentmesh.confession1689
        PRODUCT_NAME: Confession1689
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Confession1689/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: true
        CODE_SIGN_ENTITLEMENTS: Confession1689/Confession1689.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: 1689 Confession App Store
  Confession1689Watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Confession1689Watch/Sources
      - path: Confession1689/Sources/Models.swift
      - path: Confession1689Watch/Resources
        buildPhase: resources
      - path: Confession1689Watch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intentmesh.confession1689.watchkitapp
        PRODUCT_NAME: Confession1689Watch
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Confession1689Watch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: 1689 Watch App Store
  Confession1689Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Confession1689Widgets/TodayWidget.swift
      - path: Confession1689Widgets/WidgetIntents.swift
      - path: Confession1689Widgets/confession.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intentmesh.confession1689.widgets
        PRODUCT_NAME: Confession1689Widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Confession1689Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Confession1689Widgets/Confession1689Widgets.entitlements
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: 1689 Widgets App Store
